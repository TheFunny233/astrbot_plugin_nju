<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NJU小工具管理bot · 通知通道</title><link rel="stylesheet" href="./style.css?v=2.1.0"></head>
<body><main>
<header><div><h1>通知通道</h1><p class="muted">为每条 API 指定接收消息的 QQ 群和好友，再复制到 APP 或 Web。</p></div><button id="refresh" type="button">刷新列表</button></header>
<div id="modules" class="module-list"></div><p id="status" role="status" aria-live="polite"></p>
<section class="card"><h2 id="heading">新建通知通道</h2><form id="form">
<div class="grid"><label>通道名称<input id="name" required maxlength="80" placeholder="例如：高数签到通知"></label><label>通知业务<select id="module"><option value="checkin">签到结果</option><option value="course">抢课结果（待拓展）</option><option value="venue">抢场结果（待拓展）</option></select></label></div>
<div id="number-fields"><label>发送消息的机器人<select id="platform" aria-describedby="platform-hint"></select></label><p id="platform-hint" class="hint"></p>
<div class="grid"><label>通知群号<textarea id="groups" rows="4" inputmode="numeric" placeholder="填写 QQ 群号，例如：123456789&#10;多个群号可换行或用逗号分隔"></textarea><small>机器人需要已加入这些群。</small></label>
<label>私聊 QQ 号<textarea id="users" rows="4" inputmode="numeric" placeholder="填写接收人的 QQ 号，例如：987654321&#10;多个 QQ 号可换行或用逗号分隔"></textarea><small>接收人需要能够与机器人私聊。</small></label></div>
<p id="recipient-count" class="hint">群聊和私聊可同时填写，合计最多 30 个接收目标。</p></div>
<p id="legacy-hint" class="notice" hidden>这个旧通道的接收范围会原样保留。如需更换机器人或接收范围，请新建通道。</p>
<div class="form-footer"><label class="inline"><input type="checkbox" id="enabled" checked>启用此通道</label><div><button type="submit" class="primary" id="save">创建通道</button><button id="cancel" type="button" hidden>取消编辑</button></div></div>
</form></section>
<div class="section-heading"><h2>已有通道</h2><span id="channel-count" class="muted"></span></div><div id="channels"></div>
<p class="hint">API 地址包含发送凭证，请妥善保存。重置 API 后，需要将新地址重新粘贴到客户端。</p>
</main><script type="module" src="./app.js?v=2.1.0"></script></body></html>
